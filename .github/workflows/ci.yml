name: test and build
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then printf '%s\n' "$unformatted"; exit 1; fi
      - run: go test -race ./...
      - run: go vet ./...
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test audio player behavior
        run: node --test internal/webui/testdata/player.test.cjs
      - name: Test release planning tools
        shell: bash
        run: |
          npm ci --prefix tools/release --ignore-scripts --no-audit --no-fund
          npm test --prefix tools/release
  plan-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/release/package-lock.json
      - name: Install pinned release tooling
        run: npm ci --prefix tools/release --ignore-scripts --no-audit --no-fund
      - name: Plan release from Conventional Commits
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/release/plan.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: release-plan
          path: release-plan.json
          if-no-files-found: error
  binaries:
    needs: [test, plan-release]
    if: always() && needs.test.result == 'success' && (needs.plan-release.result == 'success' || needs.plan-release.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build portable executable
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          PLANNED_VERSION: ${{ needs.plan-release.outputs.version }}
        run: |
          build_version="$PLANNED_VERSION"
          if [[ -z "$build_version" ]]; then
            if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?)$ ]]; then
              build_version="${BASH_REMATCH[1]}"
            else
              build_version="0.0.0-dev.${GITHUB_SHA:0:12}"
            fi
          fi
          mkdir -p dist
          name=track-tagger
          if [ "$GOOS" = windows ]; then name=track-tagger.exe; fi
          go build -trimpath -ldflags="-s -w -X main.version=$build_version" -o "dist/$name" ./cmd/track-tagger
          if [ "$GOOS" = windows ]; then
            env -u GOOS -u GOARCH go run ./cmd/track-tagger-gui/resourcegen
            go build -trimpath -ldflags="-s -w -H=windowsgui -X main.version=$build_version" -o dist/track-tagger-gui.exe ./cmd/track-tagger-gui
          fi
          base="track-tagger-$GOOS-$GOARCH"
          cp LICENSE README.md dist/
          if [ "$GOOS" = windows ]; then
            mkdir -p dist/docs
            cp docs/windows.md dist/docs/windows.md
            (cd dist && zip "$base.zip" "$name" track-tagger-gui.exe LICENSE README.md docs/windows.md)
          else
            tar -czf "dist/$base.tar.gz" -C dist "$name" LICENSE README.md
          fi
          rm "dist/$name" dist/LICENSE dist/README.md
          if [ "$GOOS" = windows ]; then rm dist/track-tagger-gui.exe dist/docs/windows.md; rmdir dist/docs; fi
      - uses: actions/upload-artifact@v7
        with:
          name: track-tagger-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  windows-installers:
    needs: [test, plan-release]
    if: always() && needs.test.result == 'success' && (needs.plan-release.result == 'success' || needs.plan-release.result == 'skipped')
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.4.3.exe'
          $installDir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_4_3/innosetup-6.4.3.exe' -OutFile $installer
          $expectedHash = 'F3C42116542C4CC57263C5BA6C4FEABFC49FE771F2F98A79D2F7628B8762723B'
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) { throw "Inno Setup SHA-256 mismatch: $actualHash" }
          New-Item -ItemType Directory -Force $installDir | Out-Null
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$installDir") -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Inno Setup install failed with exit code $($process.ExitCode)" }
      - name: Derive installer version
        id: version
        shell: pwsh
        env:
          PLANNED_VERSION: ${{ needs.plan-release.outputs.version }}
        run: |
          if ($env:PLANNED_VERSION) {
            $installerVersion = $env:PLANNED_VERSION
            $buildVersion = $installerVersion
          } elseif ($env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)([-+][0-9A-Za-z.-]+)?$') {
            $installerVersion = $Matches[1]
            $buildVersion = $Matches[1] + $Matches[2]
          } else {
            $installerVersion = "0.0.$env:GITHUB_RUN_NUMBER"
            $buildVersion = "0.0.0-dev.$($env:GITHUB_SHA.Substring(0,12))"
          }
          "installer=$installerVersion" >> $env:GITHUB_OUTPUT
          "binary=$buildVersion" >> $env:GITHUB_OUTPUT
      - name: Build Windows executables and installer
        shell: pwsh
        env:
          GOARCH: ${{ matrix.goarch }}
          BUILD_VERSION: ${{ steps.version.outputs.binary }}
          APP_VERSION: ${{ steps.version.outputs.installer }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GOOS = 'windows'
          $env:CGO_ENABLED = '0'
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags="-s -w -X main.version=$env:BUILD_VERSION" -o dist/track-tagger.exe ./cmd/track-tagger
          if ($LASTEXITCODE -ne 0) { throw "CLI build failed with exit code $LASTEXITCODE" }
          $targetArch = $env:GOARCH
          Remove-Item Env:GOOS,Env:GOARCH
          go run ./cmd/track-tagger-gui/resourcegen
          if ($LASTEXITCODE -ne 0) { throw "Resource generation failed with exit code $LASTEXITCODE" }
          $env:GOOS = 'windows'
          $env:GOARCH = $targetArch
          go build -trimpath -ldflags="-s -w -H=windowsgui -X main.version=$env:BUILD_VERSION" -o dist/track-tagger-gui.exe ./cmd/track-tagger-gui
          if ($LASTEXITCODE -ne 0) { throw "GUI build failed with exit code $LASTEXITCODE" }
          $arch = if ($env:GOARCH -eq 'amd64') { 'x64' } else { 'arm64' }
          $iscc = Join-Path $env:RUNNER_TEMP 'InnoSetup\ISCC.exe'
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DAppArch=$arch" "/DBuildDir=$((Resolve-Path dist).Path)" "/O$((Resolve-Path dist).Path)" ".\packaging\windows\track-tagger.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
      - uses: actions/upload-artifact@v7
        with:
          name: track-tagger-windows-${{ matrix.goarch }}-installer
          path: dist/track-tagger-*-setup.exe
          if-no-files-found: error

  authorize-release:
    if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan-release.result == 'success' && needs.plan-release.outputs.release == 'true' && needs.binaries.result == 'success' && needs.windows-installers.result == 'success') || (startsWith(github.ref, 'refs/tags/v') && needs.test.result == 'success' && needs.binaries.result == 'success' && needs.windows-installers.result == 'success'))
    needs: [test, plan-release, binaries, windows-installers]
    runs-on: ubuntu-latest
    environment: github-release
    steps:
      - run: echo "Release publication approved."

  publish-main-container:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan-release.outputs.release == 'true'
    needs: [test, plan-release, binaries, windows-installers, authorize-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Select image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: VERSION=${{ needs.plan-release.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:${{ needs.plan-release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-manual-container:
    if: always() && !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.test.result == 'success' && needs.binaries.result == 'success' && needs.windows-installers.result == 'success' && needs.authorize-release.result == 'success'
    needs: [test, binaries, windows-installers, authorize-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Select image name and version tag
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          tag="${GITHUB_REF_NAME//[^a-zA-Z0-9_.-]/-}"
          tag="${tag:0:128}"
          if [[ ! "$tag" =~ ^[a-zA-Z0-9_] ]]; then tag="ref-${tag:0:124}"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: VERSION=${{ steps.image.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-main-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan-release.outputs.release == 'true'
    needs: [test, plan-release, binaries, windows-installers, authorize-release, publish-main-container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/release/package-lock.json
      - name: Download version plan
        uses: actions/download-artifact@v8
        with:
          name: release-plan
          path: .
      - name: Download archives and installers
        uses: actions/download-artifact@v8
        with:
          pattern: track-tagger-*
          merge-multiple: true
          path: dist
      - name: Install pinned release tooling
        run: npm ci --prefix tools/release --ignore-scripts --no-audit --no-fund
      - name: Stage and publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MODE: automated
        run: node tools/release/publish.mjs

  release:
    if: always() && !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.binaries.result == 'success' && needs.windows-installers.result == 'success' && needs.authorize-release.result == 'success' && needs.publish-manual-container.result == 'success'
    needs: [binaries, windows-installers, authorize-release, publish-manual-container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/release/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          pattern: track-tagger-*
          merge-multiple: true
          path: dist
      - name: Install pinned release tooling
        run: npm ci --prefix tools/release --ignore-scripts --no-audit --no-fund
      - name: Stage and publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_MODE: manual
        run: node tools/release/publish.mjs
