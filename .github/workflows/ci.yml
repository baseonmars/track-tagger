name: test and build
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then printf '%s\n' "$unformatted"; exit 1; fi
      - run: go test -race ./...
      - run: go vet ./...
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test web interface behavior
        run: node --test internal/webui/testdata/*.test.cjs
      - name: Test Windows signing safeguards
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/release/sign-windows.test.ps1
      - name: Test release planning tools
        shell: bash
        run: |
          npm ci --prefix tools/release --ignore-scripts --no-audit --no-fund
          npm test --prefix tools/release
  plan-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/release/package-lock.json
      - name: Install pinned release tooling
        run: npm ci --prefix tools/release --ignore-scripts --no-audit --no-fund
      - name: Plan release from Conventional Commits
        id: plan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/release/plan.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: release-plan
          path: release-plan.json
          if-no-files-found: error
  binaries:
    needs: [test, plan-release]
    if: always() && needs.test.result == 'success' && (needs.plan-release.result == 'success' || needs.plan-release.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build portable executable
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          PLANNED_VERSION: ${{ needs.plan-release.outputs.version }}
        run: |
          build_version="$PLANNED_VERSION"
          if [[ -z "$build_version" ]]; then
            if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?)$ ]]; then
              build_version="${BASH_REMATCH[1]}"
            else
              build_version="0.0.0-dev.${GITHUB_SHA:0:12}"
            fi
          fi
          mkdir -p dist
          name=track-tagger
          if [ "$GOOS" = windows ]; then name=track-tagger.exe; fi
          go build -trimpath -ldflags="-s -w -X main.version=$build_version" -o "dist/$name" ./cmd/track-tagger
          if [ "$GOOS" = windows ]; then
            env -u GOOS -u GOARCH go run ./cmd/track-tagger-gui/resourcegen
            go build -trimpath -ldflags="-s -w -H=windowsgui -X main.version=$build_version" -o dist/track-tagger-gui.exe ./cmd/track-tagger-gui
          fi
          base="track-tagger-$GOOS-$GOARCH"
          cp LICENSE README.md dist/
          if [ "$GOOS" = windows ]; then
            mkdir -p dist/docs
            cp docs/windows.md docs/windows-signing.md dist/docs/
            (cd dist && zip "$base.zip" "$name" track-tagger-gui.exe LICENSE README.md docs/windows.md docs/windows-signing.md)
          else
            tar -czf "dist/$base.tar.gz" -C dist "$name" LICENSE README.md
          fi
          rm "dist/$name" dist/LICENSE dist/README.md
          if [ "$GOOS" = windows ]; then rm dist/track-tagger-gui.exe dist/docs/windows.md dist/docs/windows-signing.md; rmdir dist/docs; fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.goos == 'windows' && 'unsigned' || 'release' }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  windows-installers:
    needs: [test, plan-release]
    if: always() && needs.test.result == 'success' && (needs.plan-release.result == 'success' || needs.plan-release.result == 'skipped')
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          ./tools/release/install-inno.ps1
      - name: Derive installer version
        id: version
        shell: pwsh
        env:
          PLANNED_VERSION: ${{ needs.plan-release.outputs.version }}
        run: |
          if ($env:PLANNED_VERSION) {
            $installerVersion = $env:PLANNED_VERSION
            $buildVersion = $installerVersion
          } elseif ($env:GITHUB_REF_NAME -match '^v(\d+\.\d+\.\d+)([-+][0-9A-Za-z.-]+)?$') {
            $installerVersion = $Matches[1]
            $buildVersion = $Matches[1] + $Matches[2]
          } else {
            $installerVersion = "0.0.$env:GITHUB_RUN_NUMBER"
            $buildVersion = "0.0.0-dev.$($env:GITHUB_SHA.Substring(0,12))"
          }
          "installer=$installerVersion" >> $env:GITHUB_OUTPUT
          "binary=$buildVersion" >> $env:GITHUB_OUTPUT
      - name: Build Windows executables and installer
        shell: pwsh
        env:
          GOARCH: ${{ matrix.goarch }}
          BUILD_VERSION: ${{ steps.version.outputs.binary }}
          APP_VERSION: ${{ steps.version.outputs.installer }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GOOS = 'windows'
          $env:CGO_ENABLED = '0'
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags="-s -w -X main.version=$env:BUILD_VERSION" -o dist/track-tagger.exe ./cmd/track-tagger
          if ($LASTEXITCODE -ne 0) { throw "CLI build failed with exit code $LASTEXITCODE" }
          $targetArch = $env:GOARCH
          Remove-Item Env:GOOS,Env:GOARCH
          go run ./cmd/track-tagger-gui/resourcegen
          if ($LASTEXITCODE -ne 0) { throw "Resource generation failed with exit code $LASTEXITCODE" }
          $env:GOOS = 'windows'
          $env:GOARCH = $targetArch
          go build -trimpath -ldflags="-s -w -H=windowsgui -X main.version=$env:BUILD_VERSION" -o dist/track-tagger-gui.exe ./cmd/track-tagger-gui
          if ($LASTEXITCODE -ne 0) { throw "GUI build failed with exit code $LASTEXITCODE" }
          $arch = if ($env:GOARCH -eq 'amd64') { 'x64' } else { 'arm64' }
          $iscc = Join-Path $env:RUNNER_TEMP 'InnoSetup\ISCC.exe'
          & $iscc "/DAppVersion=$env:APP_VERSION" "/DAppArch=$arch" "/DBuildDir=$((Resolve-Path dist).Path)" "/O$((Resolve-Path dist).Path)" ".\packaging\windows\track-tagger.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
      - name: Record packaging version
        shell: pwsh
        env:
          APP_VERSION: ${{ steps.version.outputs.installer }}
        run: Set-Content -LiteralPath dist/installer-version.txt -Value $env:APP_VERSION
      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-windows-${{ matrix.goarch }}-installer
          path: |
            dist/*.exe
            dist/installer-version.txt
          if-no-files-found: error

  authorize-release:
    if: always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan-release.result == 'success' && needs.plan-release.outputs.release == 'true' && needs.binaries.result == 'success' && needs.windows-installers.result == 'success') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.test.result == 'success' && needs.binaries.result == 'success' && needs.windows-installers.result == 'success'))
    needs: [test, plan-release, binaries, windows-installers]
    runs-on: ubuntu-latest
    environment: github-release
    steps:
      - run: echo "Release publication approved."

  sign-windows:
    needs: [authorize-release]
    if: always() && !cancelled() && needs.authorize-release.result == 'success'
    runs-on: windows-latest
    environment: github-release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
      ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
      ARTIFACT_SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
      ARTIFACT_SIGNING_PUBLISHER: ${{ vars.ARTIFACT_SIGNING_PUBLISHER }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v8
        with:
          name: unsigned-windows-${{ matrix.goarch }}-installer
          path: unsigned
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Validate configuration and install pinned signing tools
        shell: pwsh
        run: ./tools/release/prepare-signing.ps1
      - name: Authenticate signing identity through GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: ./tools/release/install-inno.ps1
      - name: Sign executables and package signed Windows release
        shell: pwsh
        env:
          TARGET_ARCH: ${{ matrix.goarch }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist, payload, payload/docs | Out-Null
          Copy-Item unsigned/track-tagger.exe,unsigned/track-tagger-gui.exe payload/
          foreach ($file in @('payload/track-tagger.exe', 'payload/track-tagger-gui.exe')) {
            ./tools/release/sign-windows.ps1 -File $file
          }
          Copy-Item LICENSE,README.md payload/
          Copy-Item docs/windows.md,docs/windows-signing.md payload/docs/
          Compress-Archive -Path payload/* -DestinationPath "dist/track-tagger-windows-$env:TARGET_ARCH.zip"
          $version = (Get-Content -LiteralPath unsigned/installer-version.txt -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid installer version: $version" }
          $arch = if ($env:TARGET_ARCH -eq 'amd64') { 'x64' } else { 'arm64' }
          $iscc = Join-Path $env:RUNNER_TEMP 'InnoSetup/ISCC.exe'
          $signScript = (Resolve-Path tools/release/sign-windows.ps1).Path
          # Inno's $q and $f substitute a quote and the generated file path.
          # The wrapper signs and verifies BOTH Setup and its embedded uninstaller.
          $env:SIGNING_UNINSTALLER_EVIDENCE = Join-Path $env:RUNNER_TEMP 'signed-uninstaller.exe'
          $signCommand = 'pwsh.exe -NoLogo -NoProfile -NonInteractive -File $q' + $signScript + '$q -File $f'
          & $iscc "/DAppVersion=$version" "/DAppArch=$arch" /DProductionSigning "/DBuildDir=$((Resolve-Path payload).Path)" "/O$((Resolve-Path dist).Path)" "/Sazure=$signCommand" ./packaging/windows/track-tagger.iss
          if ($LASTEXITCODE -ne 0) { throw "Signed installer build failed: $LASTEXITCODE" }
          ./tools/release/sign-windows.ps1 -VerifyOnly -File "dist/track-tagger-windows-$arch-setup.exe"
          ./tools/release/sign-windows.ps1 -VerifyOnly -File $env:SIGNING_UNINSTALLER_EVIDENCE
      - name: Accept signed x64 install and uninstall on disposable runner
        if: matrix.goarch == 'amd64'
        shell: pwsh
        run: ./tools/release/test-installed-windows.ps1 -Installer dist/track-tagger-windows-x64-setup.exe
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  publish-main-container:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan-release.outputs.release == 'true'
    needs: [test, plan-release, binaries, windows-installers, authorize-release, sign-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Select image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: VERSION=${{ needs.plan-release.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:${{ needs.plan-release.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-manual-container:
    if: always() && !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.test.result == 'success' && needs.binaries.result == 'success' && needs.windows-installers.result == 'success' && needs.authorize-release.result == 'success' && needs.sign-windows.result == 'success'
    needs: [test, binaries, windows-installers, authorize-release, sign-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Select image name and version tag
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          tag="${GITHUB_REF_NAME//[^a-zA-Z0-9_.-]/-}"
          tag="${tag:0:128}"
          if [[ ! "$tag" =~ ^[a-zA-Z0-9_] ]]; then tag="ref-${tag:0:124}"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: VERSION=${{ steps.image.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-main-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan-release.outputs.release == 'true'
    needs: [test, plan-release, binaries, windows-installers, authorize-release, sign-windows, publish-main-container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/release/package-lock.json
      - name: Download version plan
        uses: actions/download-artifact@v8
        with:
          name: release-plan
          path: .
      - name: Download archives and installers
        uses: actions/download-artifact@v8
        with:
          pattern: release-*-*
          merge-multiple: true
          path: dist
      - name: Install pinned release tooling
        run: npm ci --prefix tools/release --ignore-scripts --no-audit --no-fund
      - name: Stage and publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_MODE: automated
        run: node tools/release/publish.mjs

  release:
    if: always() && !cancelled() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.binaries.result == 'success' && needs.windows-installers.result == 'success' && needs.authorize-release.result == 'success' && needs.sign-windows.result == 'success' && needs.publish-manual-container.result == 'success'
    needs: [binaries, windows-installers, authorize-release, sign-windows, publish-manual-container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/release/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*-*
          merge-multiple: true
          path: dist
      - name: Install pinned release tooling
        run: npm ci --prefix tools/release --ignore-scripts --no-audit --no-fund
      - name: Stage and publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_MODE: manual
        run: node tools/release/publish.mjs
