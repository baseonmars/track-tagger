name: test and build
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then printf '%s\n' "$unformatted"; exit 1; fi
      - run: go test -race ./...
      - run: go vet ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test audio player behavior
        run: node --test internal/webui/testdata/player.test.cjs
  binaries:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build portable executable
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          BUILD_VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          name=track-tagger
          if [ "$GOOS" = windows ]; then name=track-tagger.exe; fi
          go build -trimpath -ldflags="-s -w -X main.version=$BUILD_VERSION" -o "dist/$name" ./cmd/track-tagger
          base="track-tagger-$GOOS-$GOARCH"
          cp LICENSE README.md dist/
          if [ "$GOOS" = windows ]; then
            (cd dist && zip "$base.zip" "$name" LICENSE README.md)
          else
            tar -czf "dist/$base.tar.gz" -C dist "$name" LICENSE README.md
          fi
          rm "dist/$name" dist/LICENSE dist/README.md
      - uses: actions/upload-artifact@v7
        with:
          name: track-tagger-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: track-tagger-*
          merge-multiple: true
          path: dist
      - name: Create release and attach archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          (cd dist && sha256sum ./*.tar.gz ./*.zip > SHA256SUMS)
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
