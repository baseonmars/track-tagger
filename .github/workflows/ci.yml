name: test and build
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then printf '%s\n' "$unformatted"; exit 1; fi
      - run: go test -race ./...
      - run: go vet ./...
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Test audio player behavior
        run: node --test internal/webui/testdata/player.test.cjs
  binaries:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build portable executable
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
          BUILD_VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          name=track-tagger
          if [ "$GOOS" = windows ]; then name=track-tagger.exe; fi
          go build -trimpath -ldflags="-s -w -X main.version=$BUILD_VERSION" -o "dist/$name" ./cmd/track-tagger
          if [ "$GOOS" = windows ]; then
            env -u GOOS -u GOARCH go run ./cmd/track-tagger-gui/resourcegen
            go build -trimpath -ldflags="-s -w -H=windowsgui -X main.version=$BUILD_VERSION" -o dist/track-tagger-gui.exe ./cmd/track-tagger-gui
          fi
          base="track-tagger-$GOOS-$GOARCH"
          cp LICENSE README.md dist/
          if [ "$GOOS" = windows ]; then
            mkdir -p dist/docs
            cp docs/windows.md dist/docs/windows.md
            (cd dist && zip "$base.zip" "$name" track-tagger-gui.exe LICENSE README.md docs/windows.md)
          else
            tar -czf "dist/$base.tar.gz" -C dist "$name" LICENSE README.md
          fi
          rm "dist/$name" dist/LICENSE dist/README.md
          if [ "$GOOS" = windows ]; then rm dist/track-tagger-gui.exe dist/docs/windows.md; rmdir dist/docs; fi
      - uses: actions/upload-artifact@v7
        with:
          name: track-tagger-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  windows-installers:
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned Inno Setup compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.4.3.exe'
          $installDir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_4_3/innosetup-6.4.3.exe' -OutFile $installer
          $expectedHash = 'F3C42116542C4CC57263C5BA6C4FEABFC49FE771F2F98A79D2F7628B8762723B'
          $actualHash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) { throw "Inno Setup SHA-256 mismatch: $actualHash" }
          New-Item -ItemType Directory -Force $installDir | Out-Null
          $process = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$installDir") -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "Inno Setup install failed with exit code $($process.ExitCode)" }
      - name: Derive installer version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/v(\d+\.\d+\.\d+(?:\.\d+)?)$') {
            $version = $Matches[1]
          } else {
            $version = "0.0.$env:GITHUB_RUN_NUMBER"
          }
          "value=$version" >> $env:GITHUB_OUTPUT
      - name: Build Windows executables and installer
        shell: pwsh
        env:
          GOARCH: ${{ matrix.goarch }}
          BUILD_VERSION: ${{ steps.version.outputs.value }}
        run: |
          $ErrorActionPreference = 'Stop'
          $env:GOOS = 'windows'
          $env:CGO_ENABLED = '0'
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags="-s -w -X main.version=$env:BUILD_VERSION" -o dist/track-tagger.exe ./cmd/track-tagger
          if ($LASTEXITCODE -ne 0) { throw "CLI build failed with exit code $LASTEXITCODE" }
          $targetArch = $env:GOARCH
          Remove-Item Env:GOOS,Env:GOARCH
          go run ./cmd/track-tagger-gui/resourcegen
          if ($LASTEXITCODE -ne 0) { throw "Resource generation failed with exit code $LASTEXITCODE" }
          $env:GOOS = 'windows'
          $env:GOARCH = $targetArch
          go build -trimpath -ldflags="-s -w -H=windowsgui -X main.version=$env:BUILD_VERSION" -o dist/track-tagger-gui.exe ./cmd/track-tagger-gui
          if ($LASTEXITCODE -ne 0) { throw "GUI build failed with exit code $LASTEXITCODE" }
          $arch = if ($env:GOARCH -eq 'amd64') { 'x64' } else { 'arm64' }
          $iscc = Join-Path $env:RUNNER_TEMP 'InnoSetup\ISCC.exe'
          & $iscc "/DAppVersion=$env:BUILD_VERSION" "/DAppArch=$arch" "/DBuildDir=$((Resolve-Path dist).Path)" "/O$((Resolve-Path dist).Path)" ".\packaging\windows\track-tagger.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
      - uses: actions/upload-artifact@v7
        with:
          name: track-tagger-windows-${{ matrix.goarch }}-installer
          path: dist/track-tagger-*-setup.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, windows-installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: track-tagger-*
          merge-multiple: true
          path: dist
      - name: Create release and attach archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          (cd dist && sha256sum ./*.tar.gz ./*.zip ./*-setup.exe > SHA256SUMS)
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
