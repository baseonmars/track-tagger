name: build container
# Main and manual version-tag releases publish from ci.yml after release approval.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the image to GHCR
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  build-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Select image name and valid reference tag
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          tag="${GITHUB_REF_NAME//[^a-zA-Z0-9_.-]/-}"
          tag="${tag:0:128}"
          if [[ ! "$tag" =~ ^[a-zA-Z0-9_] ]]; then tag="ref-${tag:0:124}"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: VERSION=${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          push: false
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  authorize-container-publish:
    if: inputs.publish
    needs: build-container
    runs-on: ubuntu-latest
    environment: github-release
    steps:
      - run: echo "Container publication approved."

  publish-container:
    if: inputs.publish
    needs: [build-container, authorize-container-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Select image name and valid reference tag
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          tag="${GITHUB_REF_NAME//[^a-zA-Z0-9_.-]/-}"
          tag="${tag:0:128}"
          if [[ ! "$tag" =~ ^[a-zA-Z0-9_] ]]; then tag="ref-${tag:0:124}"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: VERSION=${{ github.ref_name }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
